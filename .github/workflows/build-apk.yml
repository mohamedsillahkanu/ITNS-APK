name: Build ITN Campaign APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# the app is inside the ITN-Campaign-APK folder of this repository
defaults:
  run:
    working-directory: ITN-Campaign-APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ITN-Campaign.apk

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: ITN-Campaign-APK
          path: ITN-Campaign-APK/ITN-Campaign.apk

      - name: Publish as a download (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ITN Campaign build ${{ github.run_number }}
          body: Install ITN-Campaign.apk on any Android phone (ITN Mass Campaign app).
          files: ITN-Campaign-APK/ITN-Campaign.apk
